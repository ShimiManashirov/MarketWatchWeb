version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: market_watch_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: market_watch_app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/market_watch_db
      - NODE_ENV=production
    depends_on:
      - mongodb
    env_file:
      - .env

volumes:
  mongo_data:
