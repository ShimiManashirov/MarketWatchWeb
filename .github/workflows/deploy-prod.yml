name: Deployment - Production (Prod Branch)

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        echo "PORT=${{ vars.PORT || 3000 }}" > .env
        echo "NODE_ENV=${{ vars.NODE_ENV || 'production' }}" >> .env
        echo "CLIENT_URL=${{ vars.CLIENT_URL }}" >> .env
        echo "GOOGLE_CALLBACK_URL=${{ vars.GOOGLE_CALLBACK_URL }}" >> .env
        echo "FACEBOOK_CALLBACK_URL=${{ vars.FACEBOOK_CALLBACK_URL }}" >> .env
        echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> .env
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies and Run Tests on Host
      run: |
        npm install
        docker compose up -d mongodb
        sleep 15
        MONGO_URI=mongodb://admin:market_watch_pass@127.0.0.1:27017/test_db?authSource=admin BCRYPT_SALT_ROUNDS=1 npm test
        docker compose stop mongodb

    - name: Build and Restart App Container
      run: |
        docker compose down
        docker compose up --build -d
        docker system prune -f
