name: Deployment - Production (Prod Branch)

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        echo "PORT=${{ vars.PORT || 3000 }}" > .env
        echo "NODE_ENV=${{ vars.NODE_ENV || 'production' }}" >> .env
        echo "CLIENT_URL=${{ vars.CLIENT_URL }}" >> .env
        echo "GOOGLE_CALLBACK_URL=${{ vars.GOOGLE_CALLBACK_URL }}" >> .env
        echo "FACEBOOK_CALLBACK_URL=${{ vars.FACEBOOK_CALLBACK_URL }}" >> .env
        echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> .env
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
        echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
        echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}" >> .env

    - name: Run Tests (Production Validation)
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/prod_test_db
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
        NODE_ENV: test

    - name: Build and Restart with Docker Compose
      run: |
        docker-compose down
        docker-compose up --build -d
        docker system prune -f
