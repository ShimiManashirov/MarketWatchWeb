name: Automated PR (Main to Prod)

on:
  push:
    branches: [ "main" ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create or Update Pull Request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "prod"
          source_branch: "main"
          pr_title: "Release: Merge main into prod"
          pr_body: "Automated PR from main to prod branch."
          github_token: ${{ secrets.GITHUB_TOKEN }}
